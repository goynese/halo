name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main # Or your default branch if it's different

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire directory
          path: './website' # Specify the directory to upload
      # The following step is not strictly necessary if your site is pure HTML/CSS/JS
      # and does not require a build step. If you had a static site generator
      # like Jekyll or Hugo, you would add build steps here.
      # - name: Build with Jekyll (Example)
      #   uses: actions/jekyll-build-pages@v1
      #   with:
      #     source: ./website
      #     destination: ./_site 
      # - name: Upload artifact (if build step used)
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./_site


  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
